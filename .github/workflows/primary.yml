name: Test and push

on:
  push:
    branches: [ develop, main ]
    tags: [ v* ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Currently supported Python versions. 3.9 is EOL and below the
        # `python = "^3.10"` floor declared in pyproject.toml.
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        poetry-version: [ "1.8.3" ]
        include:
          # Additionally exercise the supported Django versions on a stable
          # Python. The jobs above use the Django version resolved from
          # pyproject.toml.
          - python-version: "3.12"
            poetry-version: "1.8.3"
            django-version: "4.2"
          - python-version: "3.12"
            poetry-version: "1.8.3"
            django-version: "5.1"
          - python-version: "3.12"
            poetry-version: "1.8.3"
            django-version: "5.2"

    steps:
      - uses: actions/checkout@v4
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ matrix.poetry-version }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'poetry'
      - name: Install dependencies
        run: poetry install
      - name: Pin Django ${{ matrix.django-version }}
        if: ${{ matrix.django-version != '' }}
        run: poetry run pip install "Django==${{ matrix.django-version }}.*"
      - name: Test with coverage
        run: |
          make test-cov
